plugins { id 'net.fabricmc.fabric-loom' version '1.17.5' }

allprojects {
    group = 'ru.mechanica'
    version = '1.0.0'
}

base { archivesName = 'mechanica-server-sync-fabric-26.3' }
repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
}

sourceSets.main.java.srcDirs '../common/src/main/java', '../fabric-common/src/main/java'
sourceSets.main.java.exclude 'ru/mechanica/sync/fabric/mixin/MinecraftServerMixin.java'

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
