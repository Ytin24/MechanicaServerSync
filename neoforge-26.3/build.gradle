plugins { id 'net.neoforged.moddev' version '2.0.147' }

group = 'ru.mechanica'
version = '1.0.0'
base { archivesName = 'mechanica-server-sync-neoforge-26.3' }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }
repositories { mavenCentral() }

sourceSets {
    main { java.srcDir '../common/src/main/java' }
    fixture
}

neoForge {
    version = '26.3.0.23-beta'
    addModdingDependenciesTo sourceSets.fixture
    mods {
        mechanica_server_sync { sourceSet sourceSets.main }
        mechanica_sync_fixture { sourceSet sourceSets.fixture }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(ProcessResources).configureEach {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

def fixtureJar = tasks.register('fixtureJar', Jar) {
    archiveBaseName = 'mechanica-server-sync-fixture-neoforge-26.3'
    from sourceSets.fixture.output
}
tasks.named('assemble') { dependsOn fixtureJar }

