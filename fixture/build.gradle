plugins { id 'fabric-loom' }

base { archivesName = 'mechanica-server-sync-fabric-1.21.1-fixture' }

sourceSets.main.java.srcDir '../fabric-common/src/fixture/java'

repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.3'
}

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.register('legacyFixtureCopy', Copy) {
    dependsOn remapJar
    from remapJar.archiveFile
    into layout.buildDirectory.dir('libs')
    rename { 'mechanica-server-sync-fixture-1.0.1.jar' }
}

build.dependsOn legacyFixtureCopy
